name: Publish NuGet package

# Veröffentlicht EduPlatform.SharedKernel nach GitHub Packages,
# sobald ein Tag wie v1.0.0 gepusht wird. Die Version kommt aus dem Tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EduPlatform.SharedKernel.csproj

      - name: Build
        run: dotnet build EduPlatform.SharedKernel.csproj -c Release --no-restore -p:Version=${GITHUB_REF_NAME#v}

      - name: Test
        run: dotnet test tests/EduPlatform.SharedKernel.Tests -c Release

      - name: Pack
        run: dotnet pack EduPlatform.SharedKernel.csproj -c Release --no-build -p:Version=${GITHUB_REF_NAME#v} -o out

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "out/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
